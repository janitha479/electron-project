<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFi Password Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes pulse-border {
        0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
        50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
      }
      .scanning {
        animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .card-glass {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div class="min-h-screen p-8 flex items-center justify-center">
      <div class="w-full max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-full glass mb-4">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
            </svg>
          </div>
          <h1 class="text-4xl font-bold text-white mb-2">WiFi Password Manager</h1>
          <p class="text-blue-100">View saved network profiles and passwords</p>
        </div>

        <!-- Main Card -->
        <div class="card-glass rounded-2xl shadow-2xl overflow-hidden">
          <!-- Control Panel -->
          <div class="p-6 bg-gradient-to-r from-blue-500 to-purple-600">
            <div class="flex items-center justify-between">
              <div class="flex-1">
                <button id="scanBtn" class="inline-flex items-center px-6 py-3 bg-white text-blue-600 font-semibold rounded-lg shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                  </svg>
                  Scan Networks
                </button>
              </div>
              <div id="status" class="text-white font-medium"></div>
            </div>
          </div>

          <!-- Results Panel -->
          <div class="p-6">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-bold text-gray-800">Saved WiFi Profiles</h2>
              <span id="count" class="text-sm text-gray-500"></span>
            </div>
            
            <div id="ssidList" class="space-y-3">
              <div class="text-center py-12 text-gray-400">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
                </svg>
                <p class="text-lg">Click "Scan Networks" to view saved profiles</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
          <p class="text-blue-100 text-sm">Windows WiFi Profile Scanner</p>
        </div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
